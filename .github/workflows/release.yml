name: release

# Build + publish on every push to master:
#  - official deploy package built from latest maillab/cloud-mail release
#    (built first; Windows job bundles it into the zip as data/official-dist)
#  - Windows portable zip: mail-fleet-panel.exe = Node SEA single-file exe
#    (double-click, no vbs) + data/worker-dist (custom) + data/official-dist
#  - Docker image → ghcr.io/goodmen001/mail-fleet-panel:{latest,sha,v<semver>}
#  - Release assets: mail-fleet-panel-win-<semver>.zip, custom-worker-dist-<semver>.zip,
#    official-worker-dist-<semver>+<upstream-tag>.zip
# Version: semantic version from package.json "version" (first release v0.1.0);
# bump it there for each release. GitHub tag = v<version>.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write      # create releases
  packages: write      # push to GHCR

jobs:
  official:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      upstream_tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$V" >> $GITHUB_ENV
      - name: Build official package from upstream
        id: build
        run: |
          # latest official release of maillab/cloud-mail
          TAG=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/maillab/cloud-mail/releases/latest | node -p "JSON.parse(require('fs').readFileSync(0)).tag_name")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "official upstream tag: $TAG"
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o src.tar.gz \
            "https://api.github.com/repos/maillab/cloud-mail/tarball/$TAG"
          mkdir upstream && tar xzf src.tar.gz -C upstream --strip-components=1
          # frontend build → mail-worker/dist (official repo's release .env sets VITE_OUT_DIR)
          (cd upstream/mail-vue && npm install --no-audit --no-fund --legacy-peer-deps && npm run build)
          if [ ! -f upstream/mail-worker/dist/index.html ] && [ -f upstream/mail-vue/dist/index.html ]; then
            mkdir -p upstream/mail-worker/dist
            cp -r upstream/mail-vue/dist/. upstream/mail-worker/dist/
          fi
          # worker bundle (same wrangler dry-run as the panel's import-official);
          # wrangler.toml has a custom build that shells out to pnpm
          npm install -g pnpm
          (cd upstream/mail-worker && npm install --no-audit --no-fund --legacy-peer-deps)
          (cd upstream/mail-worker && npx --yes wrangler@4 deploy --dry-run --outdir bundle)
          test -f upstream/mail-worker/bundle/index.js
          mkdir official-dist
          cp upstream/mail-worker/bundle/index.js official-dist/worker.js
          cp -r upstream/mail-worker/dist/. official-dist/
          test -f official-dist/index.html
          (cd official-dist && 7z a -tzip ../official-worker-dist-${APP_VERSION}+${TAG}.zip .)
          echo "OFFICIAL_ZIP=official-worker-dist-${APP_VERSION}+${TAG}.zip" >> $GITHUB_ENV
      - name: Upload official package artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-pkg
          path: |
            ${{ env.OFFICIAL_ZIP }}
            official-dist/

  windows:
    needs: [official]
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.official.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download official package
        uses: actions/download-artifact@v4
        with:
          name: official-pkg
          path: official
      - name: Build Windows zip
        shell: bash
        run: |
          NODE_VERSION=22.20.0
          # web dist
          (cd web && npm install --no-audit --no-fund && npm run build)
          # bundle server with esbuild (same flags as build-win.sh)
          (cd server && npm install --no-audit --no-fund)
          npx -y esbuild@0.24.0 server/src/index.js --bundle --platform=node --format=cjs \
            --outfile=pkg/sea-entry.cjs --supported:import-meta=false \
            --inject:tools/dirname-shim.js \
            --define:process.env.PANEL_SEA='"1"' \
            --define:import.meta.url='"file:///app/index.js"'
          python tools/patch-panel.py pkg/sea-entry.cjs
          # sanity: bundle must have patched paths (esbuild escapes non-ASCII to \uXXXX)
          grep -q "worker-dist" pkg/sea-entry.cjs
          # SEA: generate blob with a matching node version (win blob gen needs local
          # node of the same major; use the runner's node if v22, else npm i node@22)
          RUNNER_MAJOR=$(node -p "process.versions.node.split('.')[0]")
          if [ "$RUNNER_MAJOR" = "22" ]; then
            node --experimental-sea-config tools/sea-config.json
          else
            npx -y node@22 --experimental-sea-config tools/sea-config.json
          fi
          # node runtime as the exe base
          curl -sSLo node.zip https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip
          unzip -q node.zip
          cp node-v${NODE_VERSION}-win-x64/node.exe pkg/mail-fleet-panel.exe
          # inject the SEA blob into the exe (postject, same fuse as official SEA docs)
          npx -y postject@1.0.0-alpha.6 pkg/mail-fleet-panel.exe NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 --overwrite
          # GUI subsystem: no console window on double-click
          python tools/patch-pe-gui.py pkg/mail-fleet-panel.exe --inplace
          rm -f pkg/mail-fleet-panel.exe.console.bak
          # deploy packages shipped beside the exe
          mkdir -p pkg/data/worker-dist pkg/data/official-dist
          cp data/worker-dist/worker.js pkg/data/worker-dist/
          cp -r data/worker-dist/. pkg/data/worker-dist/
          # official deploy package: built by the `official` job (upstream release)
          if [ -f official/official-dist/worker.js ]; then
            cp -r official/official-dist/. pkg/data/official-dist/
          else
            echo "WARN: official dist missing, zip continues without it"
          fi
          # web dist + README (sea-entry.cjs is an intermediate — blob embeds it)
          rm -f pkg/sea-entry.cjs sea-prep.blob
          # tray icon binary (prebuilt Go exe from the systray2 npm package,
          # driven by server/src/services/tray-service.js over stdin/stdout JSON)
          mkdir -p pkg/traybin /tmp/traypkg
          curl -sSLo /tmp/traypkg/systray2.tgz https://registry.npmjs.org/systray2/-/systray2-2.1.4.tgz
          tar -xzf /tmp/traypkg/systray2.tgz -C /tmp/traypkg package/traybin/tray_windows_release.exe
          cp /tmp/traypkg/package/traybin/tray_windows_release.exe pkg/traybin/
          test -f pkg/traybin/tray_windows_release.exe
          mkdir -p pkg/web
          cp -r web/dist pkg/web/dist
          cp tools/win-README.txt pkg/README.txt
          test -f pkg/data/worker-dist/worker.js
          test -f pkg/data/worker-dist/index.html
          VERSION=${APP_VERSION}
          # windows runner has no zip CLI; use 7z (preinstalled)
          (cd pkg && 7z a -tzip ../mail-fleet-panel-win-${VERSION}.zip .)
          # deploy packages for the version center
          (cd data/worker-dist && 7z a -tzip ../../custom-worker-dist-${VERSION}.zip .)
          echo "ZIP=mail-fleet-panel-win-${VERSION}.zip" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-zip
          path: |
            ${{ env.ZIP }}
            custom-worker-dist-${{ env.VERSION }}.zip

  docker:
    needs: [official]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.official.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:v${{ env.APP_VERSION }}

  publish:
    needs: [official, windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-zip
      - uses: actions/download-artifact@v4
        with:
          name: official-pkg
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.official.outputs.version }}
          name: v${{ needs.official.outputs.version }}
          body: |
            ## Mail Fleet Panel v${{ needs.official.outputs.version }}

            内置定制包（基于官方，含面板定制）与官方包（同步官方最新 Release 自动构建），批量部署时可选。

            ### Windows
            下载 `mail-fleet-panel-win-*.zip` 解压，**双击 `mail-fleet-panel.exe` 直接运行**（免 vbs）。
            浏览器打开 http://127.0.0.1:3300，默认账号 admin / admin123（登录后请立即改密码）。
            data/ 目录为数据目录，备份它即可。

            ### Docker / docker-compose
            ```yaml
            services:
              mail-fleet-panel:
                image: ghcr.io/goodmen001/mail-fleet-panel:v${{ needs.official.outputs.version }}
                container_name: mail-fleet-panel
                ports:
                  - "3300:3300"
                environment:
                  - PANEL_SECRET=please-change-me-to-a-long-random-string
                volumes:
                  - ./data:/app/data
                restart: unless-stopped
            ```
            启动：`docker compose up -d`，访问 http://localhost:3300

            ### 版本中心部署包
            - `custom-worker-dist-*.zip`：定制部署包（可在版本中心「从 GitHub 同步」一键导入）
            - `official-worker-dist-*.zip`：官方部署包（同步官方最新 Release 构建，同一升级地址）
          files: |
            mail-fleet-panel-win-*.zip
            custom-worker-dist-*.zip
            official-worker-dist-*.zip
